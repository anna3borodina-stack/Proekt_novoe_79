<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #f0f4ff 0%, #e8f0fe 40%, #fdf8ff 100%);
      color: #1a1a2e;
      line-height: 1.5;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 700;
      text-align: center;
      margin: 0 0 2rem;
      letter-spacing: -0.02em;
      color: #16213e;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    li {
      background: #fff;
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 4px 20px rgba(22, 33, 62, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.12);
      font-size: 1.05rem;
    }
    li span {
      display: inline-block;
      width: 1.75rem;
      height: 1.75rem;
      line-height: 1.75rem;
      text-align: center;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 0.65rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ul>
      <li><span>1</span>5 идей постов для экспертов</li>
      <li><span>2</span>3 идеи сторис на сегодня</li>
      <li><span>3</span>Контент-план на неделю</li>
    </ul>
  </main>
</body>
</html>
